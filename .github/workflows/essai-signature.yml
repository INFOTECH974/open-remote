name: Essai de signature macOS

# Vérifie, sur une machine Mac, que deux versions de Distant signées avec le
# même certificat auto-signé sont pour macOS la même application (même
# « designated requirement ») : c'est ce qui fait garder les autorisations
# « Enregistrement de l'écran » et « Accessibilité » d'une version à l'autre.
#
# L'essai suit le chemin d'une vraie version, avec les mêmes scripts :
# certificat-macos.sh crée le certificat (ici jetable), trousseau-macos.sh
# l'importe comme le fait release.yml, et Tauri construit et signe
# l'application, deux fois, sous deux numéros de version.
#
# Lancement manuel uniquement. Ne lit aucun secret du dépôt et ne publie rien.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CIBLE: aarch64-apple-darwin

jobs:
  essai:
    runs-on: macos-latest
    # Deux builds prennent une quinzaine de minutes ; au-delà, quelque chose
    # attend une réponse à l'écran (le trousseau, le plus souvent).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Créer un certificat jetable, comme le vrai
        run: |
          bash .github/scripts/certificat-macos.sh "$RUNNER_TEMP/certificat" "Distant Essai"
          mot_de_passe="$(cat "$RUNNER_TEMP/certificat/mot-de-passe.txt")"
          echo "::add-mask::$mot_de_passe"
          # Ce que les secrets du dépôt fournissent à release.yml.
          echo "MACOS_CERTIFICATE=$(cat "$RUNNER_TEMP/certificat/secret-MACOS_CERTIFICATE.txt")" >> "$GITHUB_ENV"
          echo "MACOS_CERTIFICATE_PASSWORD=$mot_de_passe" >> "$GITHUB_ENV"
          openssl version

      - name: L'importer dans un trousseau temporaire, comme la release
        timeout-minutes: 5
        run: bash .github/scripts/trousseau-macos.sh

      # En quelques secondes, avant les builds : le certificat signe-t-il, et
      # deux programmes différents ont-ils la même identité ?
      - name: Deux petits programmes, une même identité
        timeout-minutes: 5
        run: |
          cd "$RUNNER_TEMP"
          for n in 1 2; do
            printf 'int main(void){return %s;}\n' "$n" > "p$n.c" && cc "p$n.c" -o "p$n"
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --identifier app.distant.essai "p$n"
            echo "programme $n : $(codesign -d -r- "p$n" 2>/dev/null)"
          done
          codesign --verify -R="$(codesign -d -r- p1 2>/dev/null | sed -n 's/^.*designated => //p')" p2
          # Ce que Distant lit pour savoir si sa signature tient d'une version
          # à l'autre : la ligne « Authority= » n'apparaît qu'au niveau 2.
          echo "--- codesign -dv" && codesign -dv p1
          echo "--- codesign -dv --verbose=2" && codesign -dv --verbose=2 p1
          cp p1 adhoc && codesign --force --sign - adhoc
          echo "--- codesign -dv --verbose=2 (ad hoc)" && codesign -dv --verbose=2 adhoc

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ env.CIBLE }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Sans les fichiers de mise à jour : ils demanderaient la clé minisign
      # du dépôt, dont la signature macOS ne dépend pas.
      - name: Construire et signer la version actuelle
        run: |
          npx tauri build --target "$CIBLE" --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          bash .github/scripts/verifier-signature-macos.sh "target/$CIBLE/release/bundle/macos/Distant.app"
          echo "--- image disque"
          codesign -dv --verbose=2 "target/$CIBLE/release/bundle/dmg/"*.dmg 2>&1 | grep -E '^(Identifier|Signature|Authority)'
          mkdir "$RUNNER_TEMP/v1" && ditto "target/$CIBLE/release/bundle/macos/Distant.app" "$RUNNER_TEMP/v1/Distant.app"

      - name: Construire et signer une version suivante (99.0.0)
        run: |
          npx tauri build --target "$CIBLE" --bundles app \
            --config '{"version":"99.0.0","bundle":{"createUpdaterArtifacts":false}}'
          bash .github/scripts/verifier-signature-macos.sh "target/$CIBLE/release/bundle/macos/Distant.app"
          mkdir "$RUNNER_TEMP/v2" && ditto "target/$CIBLE/release/bundle/macos/Distant.app" "$RUNNER_TEMP/v2/Distant.app"

      - name: Deux versions de Distant, une même identité pour macOS
        run: |
          cd "$RUNNER_TEMP"
          version() { /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$1/Contents/Info.plist"; }
          exigence() { codesign -d -r- "$1" 2>/dev/null | sed -n 's/^.*designated => //p'; }
          empreinte() { codesign -dv --verbose=4 "$1" 2>&1 | sed -n 's/^CDHash=//p'; }

          for v in v1 v2; do
            echo "$v : version $(version $v/Distant.app), empreinte du code $(empreinte $v/Distant.app)"
            echo "$v : identité $(exigence $v/Distant.app)"
          done
          if [ "$(version v1/Distant.app)" = "$(version v2/Distant.app)" ] || [ "$(empreinte v1/Distant.app)" = "$(empreinte v2/Distant.app)" ]; then
            echo "::error::Les deux builds sont identiques : l'essai ne prouve rien."
            exit 1
          fi
          if [ -z "$(exigence v1/Distant.app)" ] || [ "$(exigence v1/Distant.app)" != "$(exigence v2/Distant.app)" ]; then
            echo "::error::Les deux versions n'ont pas la même identité."
            exit 1
          fi

          # Témoin : signées ad hoc, les deux mêmes versions sont pour macOS
          # deux applications différentes.
          for v in v1 v2; do
            ditto "$v/Distant.app" "adhoc-$v/Distant.app"
            codesign --force --sign - "adhoc-$v/Distant.app" 2>/dev/null
            echo "ad hoc $v : identité $(exigence adhoc-$v/Distant.app)"
          done
          if [ "$(exigence adhoc-v1/Distant.app)" = "$(exigence adhoc-v2/Distant.app)" ]; then
            echo "::error::Le témoin ad hoc aurait dû donner deux identités différentes."
            exit 1
          fi

          # Comme sur le Mac d'un client : le certificat n'y est dans aucun
          # trousseau, et macOS vérifie la nouvelle version contre l'identité
          # enregistrée avec les autorisations de l'ancienne.
          security delete-keychain "$DISTANT_TROUSSEAU"
          codesign --verify --strict -R="$(exigence v1/Distant.app)" v2/Distant.app

          echo "RÉSULTAT : la version $(version v2/Distant.app) satisfait l'identité enregistrée pour la version $(version v1/Distant.app), sans le certificat sur la machine."
          {
            echo "### Même identité d'une version à l'autre"
            echo
            echo "| | Version | Empreinte du code | Identité pour macOS |"
            echo "|---|---|---|---|"
            for v in v1 v2 adhoc-v1 adhoc-v2; do
              echo "| $v | $(version $v/Distant.app) | \`$(empreinte $v/Distant.app)\` | \`$(exigence $v/Distant.app)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
