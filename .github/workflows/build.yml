# Construit les installateurs macOS et Windows.
# Lancement manuel (onglet Actions → « Installateurs » → Run workflow) ou à
# chaque étiquette `v*`. Les installateurs sont à télécharger dans les
# « Artifacts » de l'exécution. Ils ne sont pas signés par un certificat.
name: Installateurs

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Binaire universel : fonctionne sur les Mac Apple Silicon et Intel.
          - name: macOS
            id: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            id: windows
            os: windows-latest
            targets: ""
            args: ""
            bundle: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npm run build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: distant-${{ matrix.id }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
